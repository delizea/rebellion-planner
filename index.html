<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>Rebellion 2026 Planner</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#111111" />

  <style>
    :root {
      --bg: #0f0f10;
      --card: #1a1a1c;
      --border: #2a2a2d;
      --text: #f5f5f5;
      --muted: #b0b0b0;
      --accent: #ff3366;
      --danger: #ff4b4b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #111;
      border-bottom: 1px solid var(--border);
      padding: 12px;
    }

    .toolbar,
    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .toolbar {
      margin-top: 10px;
    }

    .tab,
    .btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
    }

    .primary {
      background: var(--accent);
      border-color: var(--accent);
    }

    .danger {
      background: var(--danger);
      border-color: var(--danger);
    }

    #app {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 12px;
      padding: 12px;
    }

    @media (max-width: 900px) {
      #app {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item {
      display: flex;
      gap: 12px;
      padding: 12px;
      background: #151517;
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
    }

    .item:hover {
      border-color: var(--accent);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .meta,
    .small {
      color: var(--muted);
      font-size: 13px;
    }

    .tag {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #2c2c2f;
    }

    .must {
      background: var(--accent);
    }

    .clash {
      background: #ff9500;
    }

    input,
    textarea {
      width: 100%;
      background: #111;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .pill {
      background: #222;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
    }

    h3 {
      margin: 0;
      font-size: 15px;
    }
  </style>
</head>

<body>
  <header>
    <div class="tabs" id="tabs"></div>

    <div class="toolbar">
      <button class="btn primary" id="btnBrowse">Browse</button>
      <button class="btn" id="btnPlan">My Plan</button>
      <button class="btn" id="btnExport">Export</button>
      <button class="btn" id="btnImport">Import</button>
      <button class="btn danger" id="btnReset">Reset</button>

      <div class="pill" id="status"></div>
    </div>
  </header>

  <main id="app">
    <section id="left"></section>
    <aside id="right" class="card"></aside>
  </main>

  <script src="app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }
  </script>
</body>
</html>
